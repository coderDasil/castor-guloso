# =============================================================================
# Castor Guloso — Application Configuration
# =============================================================================

spring.application.name=castor-guloso

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/castor_guloso
spring.datasource.username=castor
spring.datasource.password=${CASTOR_DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway manages the schema; Hibernate validates against it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Vaadin ──────────────────────────────────────────────────────────────────
server.port=7080

# Vaadin production mode (set to false during dev)
vaadin.productionMode=false

# ── WhatsApp Business API ───────────────────────────────────────────────────
# These must be set via environment variables or an external config server
# in production.
whatsapp.api.base-url=https://graph.facebook.com/v18.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.api.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:castor_guloso_dev}

# ── Scheduling ──────────────────────────────────────────────────────────────
# Default daily schedule (10:00 AM weekdays)
castor.scheduler.default-hour=10
castor.scheduler.default-minute=0
castor.scheduler.cutoff-hour=11
castor.scheduler.cutoff-minute=30

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
