# =============================================================================
# Castor Guloso — Default Configuration (Development / H2)
# =============================================================================
# Runs out of the box with H2 file-based database.
# Switch to PostgreSQL with: --spring.profiles.active=prod

spring.application.name=castor-guloso

# ── Database (H2 — zero config) ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/castor_guloso_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway manages the schema; Hibernate validates against it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Vaadin ──────────────────────────────────────────────────────────────────
server.port=7080
vaadin.productionMode=false

# ── WhatsApp Business API ───────────────────────────────────────────────────
whatsapp.api.base-url=https://graph.facebook.com/v18.0
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.api.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:castor_guloso_dev}
whatsapp.mode=logging

# ── Scheduling ──────────────────────────────────────────────────────────────
castor.scheduler.default-hour=10
castor.scheduler.default-minute=0
castor.scheduler.cutoff-hour=11
castor.scheduler.cutoff-minute=30
castor.scheduler.send-cron=0 0 10 * * *
castor.scheduler.cutoff-cron=0 30 11 * * *

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.castor.guloso=DEBUG
