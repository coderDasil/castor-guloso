# =============================================================================
# Castor Guloso — Production Profile (PostgreSQL)
# =============================================================================
# Activate with: --spring.profiles.active=prod
# Or: export SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=jdbc:postgresql://localhost:5432/castor_guloso
spring.datasource.username=castor
spring.datasource.password=${CASTOR_DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Production optimizations
vaadin.productionMode=true

# Disable H2 console in production
spring.h2.console.enabled=false
